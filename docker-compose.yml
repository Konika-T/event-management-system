services:
  server:
    build: ./server
    container_name: eventhub-server
    env_file: ./server/.env
    environment:
      PORT: 5001
      CLIENT_ORIGIN: http://localhost:3000,http://localhost:5173
    ports:
      - "5001:5001"
    restart: unless-stopped

  client:
    build: ./client
    container_name: eventhub-client
    ports:
      - "3000:80"
    depends_on:
      - server
    restart: unless-stopped